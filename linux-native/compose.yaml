services:
  mbl:
    build:
      context: .
      dockerfile: Dockerfile
    image: mbl-linux-native:latest
    container_name: mbl-linux-native
    restart: unless-stopped
    # Solo escucha en la interfaz local del host: el servicio no queda
    # expuesto a la red sin una decisión explícita.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MBL_HOST: 0.0.0.0
      MBL_PORT: "3000"
      MBL_DATA_DIR: /data
      MBL_MAX_PROFILES: "2"
      MBL_REQUIRE_AUTH: "true"
      # El token se inyecta desde el entorno o desde un archivo .env; nunca se
      # escribe en el repositorio ni se imprime en los logs.
      MBL_AUTH_TOKEN: ${MBL_AUTH_TOKEN:?MBL_AUTH_TOKEN is required}
    volumes:
      - mbl-data:/data
    # El navegador necesita más memoria que el límite por defecto y debe
    # poder escribir en su cache de usuario.
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mbl-data:
