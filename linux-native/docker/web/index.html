<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MarketerBrowserLite</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #e6e9ef;
      }

      #screen {
        position: fixed;
        inset: 0;
        background: #000;
      }

      /*
        Floating controls over the shared screen. The application hides its own
        window while a profile runs, so these buttons are the way to bring a
        window back without leaving the page.
      */
      #toolbar {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 20;
        display: flex;
        gap: 8px;
      }

      #toolbar[hidden] {
        display: none;
      }

      #toolbar button {
        padding: 7px 12px;
        border-radius: 8px;
        border: 1px solid #39425a;
        background: rgba(22, 26, 34, 0.82);
        color: #e6e9ef;
        font-size: 13px;
        line-height: 1.2;
        cursor: pointer;
        backdrop-filter: blur(4px);
      }

      #toolbar button:hover {
        background: rgba(79, 140, 255, 0.9);
        border-color: #4f8cff;
        color: #fff;
      }

      #toolbar button:focus-visible {
        outline: 2px solid #4f8cff;
        outline-offset: 1px;
      }

      #login {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f1115;
      }

      #login[hidden],
      #screen[hidden] {
        display: none;
      }

      form {
        width: min(360px, 90vw);
        display: grid;
        gap: 12px;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 18px;
        font-weight: 600;
      }

      input,
      button {
        font: inherit;
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid #2a3040;
        background: #161a22;
        color: inherit;
      }

      input:focus-visible,
      button:focus-visible {
        outline: 2px solid #4f8cff;
        outline-offset: 1px;
      }

      button {
        background: #4f8cff;
        border-color: #4f8cff;
        color: #fff;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: progress;
      }

      #message {
        min-height: 22px;
        margin: 0;
        color: #f0736a;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="login">
      <form id="form" autocomplete="off">
        <h1>MarketerBrowserLite</h1>
        <input
          id="token"
          type="password"
          placeholder="Access token"
          autocomplete="current-password"
          required
        />
        <button id="connect" type="submit">Connect</button>
        <p id="message" role="status"></p>
      </form>
    </div>
    <div id="screen" hidden></div>

    <div id="toolbar" hidden>
      <button type="button" id="focus-app" title="Bring the application to the front">
        App
      </button>
      <button type="button" id="focus-browser" title="Bring the browser of the profile to the front">
        Navegador
      </button>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
