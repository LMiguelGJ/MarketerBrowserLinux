<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MarketerBrowserLite</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #e6e9ef;
      }

      #screen {
        position: fixed;
        inset: 0;
        background: #000;
      }

      #login {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f1115;
      }

      #login[hidden],
      #screen[hidden] {
        display: none;
      }

      form {
        width: min(360px, 90vw);
        display: grid;
        gap: 12px;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 18px;
        font-weight: 600;
      }

      input,
      button {
        font: inherit;
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid #2a3040;
        background: #161a22;
        color: inherit;
      }

      input:focus-visible,
      button:focus-visible {
        outline: 2px solid #4f8cff;
        outline-offset: 1px;
      }

      button {
        background: #4f8cff;
        border-color: #4f8cff;
        color: #fff;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: progress;
      }

      #message {
        min-height: 22px;
        margin: 0;
        color: #f0736a;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="login">
      <form id="form" autocomplete="off">
        <h1>MarketerBrowserLite</h1>
        <input
          id="token"
          type="password"
          placeholder="Access token"
          autocomplete="current-password"
          required
        />
        <button id="connect" type="submit">Connect</button>
        <p id="message" role="status"></p>
      </form>
    </div>
    <div id="screen" hidden></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
